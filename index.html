<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDNIGHT GARAGE SYSTEM</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(15, 30, 49, 0.92);
      --panel-2: #101f33;
      --line: rgba(255,255,255,0.12);
      --text: #f6f8fb;
      --muted: #9fb0c3;
      --accent: #42d392;
      --accent-2: #56a8ff;
      --warning: #ffbd4a;
      --danger: #ff6577;
      --keeper: #ffb84d;
      --player: #59c3ff;
      --shadow: 0 20px 55px rgba(0,0,0,.38);
    }

    .role-gate { position:fixed; inset:0; z-index:1000; display:grid; place-items:center; padding:20px; background:rgba(2,7,13,.94); backdrop-filter:blur(12px); }
    .role-gate.hidden { display:none; }
    .gate-card { width:min(460px,100%); padding:24px; border:1px solid var(--line); border-radius:22px; background:linear-gradient(180deg,#12233a,#091525); box-shadow:var(--shadow); }
    .gate-card h2 { margin:0 0 8px; }
    .gate-card p { color:var(--muted); line-height:1.5; }
    .gate-actions { display:grid; gap:10px; margin-top:18px; }
    .gate-card input { margin:10px 0; padding:12px; width:100%; color:var(--text); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:12px; }
    .gate-status { font-size:12px; color:var(--muted); margin-top:12px; }
    .live-badge { display:none; }
    body.live-mode .live-badge { display:inline-flex; }
    body.live-mode #setupPage, body.live-mode .draw-page-toolbar, body.live-mode .draw-back-bar, body.live-mode #backToSetupBtn, body.live-mode #drawBtn, body.live-mode #undoBtn, body.live-mode #summaryBtn, body.live-mode #resetCurrentBtn, body.live-mode #resetAllBtn, body.live-mode #categorySelect, body.live-mode .assignment-controls, body.live-mode #dynamicRoleControls, body.live-mode #summaryModal, body.live-mode .space-hint { display:none !important; }
    body.live-mode .footer-actions { display:none !important; }
    body.live-mode #drawPage { display:block !important; }
    body.live-mode .picker-layout { grid-template-columns:1fr; }
    body.live-mode .draw-panel { min-height:260px; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(4, 12, 22, .78), rgba(4, 12, 22, .82)),
        url('BG.jpg') center center / cover no-repeat fixed,
        linear-gradient(145deg, #050b14 0%, #081526 52%, #06101c 100%);
      padding: 22px;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
    }

    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .hero h1 {
      font-size: clamp(27px, 4vw, 46px);
      line-height: 1;
      margin: 0 0 9px;
      letter-spacing: -.04em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 760px;
      line-height: 1.55;
    }

    .brand-logo {
      width: clamp(74px, 9vw, 110px);
      height: clamp(74px, 9vw, 110px);
      object-fit: contain;
      border-radius: 18px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.13);
      padding: 10px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      flex: 0 0 auto;
    }

    .hero-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      padding: 10px 13px;
      border-radius: 999px;
      border: 1px solid rgba(66,211,146,.28);
      background: rgba(66,211,146,.09);
      color: #b9f4db;
      font-size: 13px;
      font-weight: 800;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(66,211,146,.8);
    }

    .sponsor-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(340px, 34vw, 480px);
      min-height: 145px;
      padding: 16px 20px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(7, 17, 31, .52);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .sponsor-logo {
      width: 100%;
      max-width: 440px;
      max-height: 125px;
      object-fit: contain;
      display: block;
    }

    .top-grid {
      display: grid;
      grid-template-columns: 1.05fr 1.95fr;
      gap: 18px;
      align-items: stretch;
    }

    .card {
      background: linear-gradient(180deg, rgba(17,33,54,.96), rgba(9,20,35,.96));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 19px 13px;
      border-bottom: 1px solid var(--line);
    }

    .card-head h2, .card-head h3 {
      margin: 0;
      font-size: 17px;
    }

    .card-body { padding: 18px; }
    .settings-grid { display: grid; gap: 13px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    input[type="text"], textarea, select {
      width: 100%;
      color: var(--text);
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 13px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input[type="text"], select { padding: 12px 13px; }

    textarea {
      min-height: 152px;
      resize: vertical;
      padding: 13px;
      line-height: 1.5;
    }

    input:focus, textarea:focus, select:focus {
      border-color: rgba(66,211,146,.7);
      box-shadow: 0 0 0 4px rgba(66,211,146,.10);
      background: rgba(255,255,255,.075);
    }

    .category-tabs {
      display: flex;
      gap: 9px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: thin;
    }

    .tab-btn {
      flex: 0 0 min(220px, 75vw);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      color: var(--muted);
      padding: 12px 13px;
      font-weight: 900;
      text-align: left;
      transition: .2s;
    }

    .tab-btn small {
      display: block;
      opacity: .68;
      font-size: 11px;
      margin-top: 3px;
      font-weight: 700;
    }

    .tab-btn.active {
      color: #eafff6;
      border-color: rgba(66,211,146,.45);
      background: linear-gradient(135deg, rgba(66,211,146,.17), rgba(86,168,255,.10));
      box-shadow: inset 0 0 0 1px rgba(66,211,146,.09);
    }

    .team-editor, .list-type-editor {
      display: grid;
      gap: 9px;
    }

    .team-editor-row, .list-type-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .team-letter {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: rgba(86,168,255,.12);
      color: #dff0ff;
      font-weight: 1000;
      border: 1px solid rgba(86,168,255,.25);
    }

    .icon-btn {
      border: 1px solid rgba(255,101,119,.25);
      background: rgba(255,101,119,.10);
      color: #ffdce1;
      border-radius: 11px;
      padding: 10px 12px;
      font-weight: 900;
    }

    .settings-actions, .footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .settings-actions { margin-top: 2px; }

    .text-settings-panel {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.028);
    }

    .text-settings-title {
      margin: 0;
      font-size: 14px;
    }

    .text-settings-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .list-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .list-box {
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 14px;
      background: rgba(255,255,255,.026);
    }

    .list-box-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .list-box-head strong { font-size: 14px; }

    .counter {
      min-width: 34px;
      height: 26px;
      border-radius: 99px;
      display: inline-grid;
      place-items: center;
      font-weight: 900;
      font-size: 12px;
      background: rgba(255,255,255,.08);
      color: var(--text);
    }

    .helper {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .picker-card { margin-top: 18px; }

    .picker-layout {
      display: grid;
      grid-template-columns: minmax(280px, .7fr) minmax(0, 2.3fr);
      gap: 18px;
      padding: 18px;
    }

    .draw-panel {
      min-height: 404px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background:
        linear-gradient(145deg, rgba(66,211,146,.08), rgba(86,168,255,.035)),
        rgba(255,255,255,.025);
      padding: 17px;
      display: flex;
      flex-direction: column;
    }

    .draw-controls {
      display: grid;
grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
gap: 9px;
}
.role-btn {
border: 1px solid var(--line);
border-radius: 13px;
padding: 11px;
background: rgba(255,255,255,.045);
color: var(--muted);
font-weight: 900;
transition: .2s;
}
.role-btn.active {
color: #eafff6;
background: linear-gradient(135deg, rgba(66,211,146,.17), rgba(86,168,255,.12));
border-color: rgba(66,211,146,.48);
box-shadow: inset 0 0 0 1px rgba(66,211,146,.08);
}
.assignment-controls {
display: grid;
grid-template-columns: 1fr;
gap: 10px;
margin-top: 12px;
padding: 12px;
border-radius: 14px;
border: 1px solid var(--line);
background: rgba(255,255,255,.035);
}
.assignment-field label {
display: block;
margin-bottom: 6px;
color: var(--muted);
font-size: 10px;
font-weight: 900;
letter-spacing: .08em;
text-transform: uppercase;
}
.assignment-field select {
padding: 10px 11px;
border-radius: 11px;
}
.assignment-field[hidden] { display: none; }
.mode-note {
color: var(--muted);
font-size: 11px;
line-height: 1.45;
}
.draw-stage {
flex: 1;
display: grid;
place-items: center;
text-align: center;
padding: 24px 10px;
}
.draw-stage .eyebrow {
color: var(--muted);
text-transform: uppercase;
letter-spacing: .12em;
font-size: 11px;
font-weight: 900;
margin-bottom: 11px;
}
.picked-name {
min-height: 112px;
display: grid;
place-items: center;
font-size: clamp(30px, 4vw, 58px);
font-weight: 1000;
letter-spacing: -.04em;
line-height: 1.04;
word-break: break-word;
text-wrap: balance;
text-shadow: 0 9px 25px rgba(0,0,0,.35);
}
.idle-logo {
width: min(240px, 72vw);
max-height: 180px;
object-fit: contain;
display: block;
margin: 0 auto;
filter: drop-shadow(0 12px 24px rgba(0,0,0,.34));
}
.picked-name.batch-mode {
width: 100%;
min-height: 170px;
align-content: center;
gap: 7px;
font-size: clamp(17px, 2vw, 25px);
letter-spacing: 0;
line-height: 1.25;
}
.batch-name {
width: min(100%, 430px);
display: grid;
grid-template-columns: minmax(0, 1fr) auto;
gap: 10px;
align-items: center;
padding: 9px 11px;
border-radius: 11px;
border: 1px solid rgba(255,255,255,.10);
background: rgba(255,255,255,.055);
text-align: left;
text-shadow: none;
}
.batch-name-only {
grid-template-columns: 1fr;
text-align: center;
}
.batch-person {
min-width: 0;
overflow-wrap: anywhere;
font-weight: 1000;
}
.batch-team {
color: var(--accent);
font-size: 12px;
font-weight: 900;
white-space: nowrap;
}
.picked-name.rolling {
animation: pulseRoll .11s infinite alternate;
filter: blur(.25px);
}
.picked-name.winner {
animation: winnerPop .65s cubic-bezier(.16,1.25,.32,1);
}
.destination {
color: var(--accent);
font-weight: 900;
min-height: 24px;
margin-top: 8px;
}
.space-hint {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
color: var(--muted);
font-size: 12px;
margin-bottom: 12px;
}
kbd {
min-width: 58px;
padding: 6px 10px;
border-radius: 8px;
color: var(--text);
border: 1px solid rgba(255,255,255,.19);
border-bottom-width: 3px;
background: rgba(255,255,255,.07);
font-weight: 900;
}
.primary-btn, .secondary-btn, .danger-btn {
border: 0;
border-radius: 13px;
padding: 12px 15px;
font-weight: 900;
transition: transform .15s, opacity .15s, box-shadow .15s;
}
.primary-btn {
color: #052015;
background: linear-gradient(135deg, #67e8b2, #42d392);
box-shadow: 0 10px 25px rgba(66,211,146,.20);
}
.secondary-btn {
color: var(--text);
background: rgba(255,255,255,.08);
border: 1px solid var(--line);
}
.danger-btn {
color: #ffdce1;
background: rgba(255,101,119,.11);
border: 1px solid rgba(255,101,119,.25);
}
button:hover { transform: translateY(-1px); }
button:active { transform: translateY(1px); }
button:disabled { cursor: not-allowed; opacity: .45; transform: none; }
.team-area {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
gap: 14px;
align-items: stretch;
}
.team-column {
min-width: 0;
border: 1px solid var(--line);
border-radius: 19px;
background: rgba(255,255,255,.027);
overflow: hidden;
}
.team-header {
padding: 16px;
border-bottom: 1px solid var(--line);
display: flex;
justify-content: space-between;
gap: 10px;
align-items: center;
}
.team-title {
margin: 0;
font-size: clamp(18px, 2.5vw, 25px);
line-height: 1.1;
}
.team-total {
color: var(--muted);
font-size: 12px;
font-weight: 800;
white-space: nowrap;
}
.roster-section { padding: 14px; }
.roster-section + .roster-section { border-top: 1px solid var(--line); }
.roster-label {
display: flex;
justify-content: space-between;
margin-bottom: 9px;
color: var(--muted);
font-size: 11px;
font-weight: 900;
letter-spacing: .08em;
text-transform: uppercase;
}
.roster-list {
display: grid;
gap: 7px;
min-height: 42px;
}
.empty {
display: grid;
place-items: center;
min-height: 42px;
border: 1px dashed rgba(255,255,255,.11);
border-radius: 10px;
color: rgba(159,176,195,.58);
font-size: 12px;
}
.person {
display: flex;
align-items: center;
gap: 9px;
padding: 9px 10px;
border-radius: 11px;
background: rgba(255,255,255,.055);
border: 1px solid rgba(255,255,255,.075);
animation: rowIn .35s ease both;
}
.person-number {
width: 26px;
height: 26px;
display: grid;
place-items: center;
flex: 0 0 26px;
border-radius: 8px;
background: rgba(255,255,255,.08);
color: var(--muted);
font-weight: 900;
font-size: 11px;
}
.person-name {
min-width: 0;
flex: 1;
font-weight: 800;
overflow-wrap: anywhere;
}
.role-tag {
flex: 0 0 auto;
font-size: 10px;
font-weight: 900;
padding: 4px 7px;
border-radius: 999px;
color: #e7f7ff;
background: rgba(86,168,255,.14);
}
.footer-actions { padding: 0 18px 18px; }
.toast {
position: fixed;
right: 20px;
bottom: 20px;
max-width: min(380px, calc(100vw - 40px));
padding: 13px 15px;
border-radius: 13px;
background: #12233a;
border: 1px solid var(--line);
box-shadow: var(--shadow);
color: var(--text);
font-weight: 800;
font-size: 13px;
opacity: 0;
transform: translateY(12px);
pointer-events: none;
transition: .25s;
z-index: 100;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { border-color: rgba(255,101,119,.42); color: #ffd8de; }
.modal-backdrop {
position: fixed;
inset: 0;
display: none;
place-items: center;
padding: 20px;
background: rgba(1,5,10,.78);
backdrop-filter: blur(8px);
z-index: 90;
}
.modal-backdrop.open { display: grid; }
.modal {
width: min(760px, 100%);
max-height: 85vh;
overflow: auto;
border: 1px solid var(--line);
border-radius: 20px;
background: #0c192a;
box-shadow: var(--shadow);
padding: 20px;
}
.modal h3 { margin: 0 0 7px; }
.modal p { color: var(--muted); line-height: 1.55; }
.summary-box {
white-space: pre-wrap;
background: rgba(255,255,255,.05);
border: 1px solid var(--line);
border-radius: 13px;
padding: 14px;
line-height: 1.6;
font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
font-size: 13px;
}
.modal-actions {
display: flex;
justify-content: flex-end;
flex-wrap: wrap;
gap: 9px;
margin-top: 14px;
}
.page-view { display: none; }
.page-view.active {
display: block;
animation: pageFade .28s ease both;
}
.page-step-bar,
.draw-page-toolbar {
display: flex;
align-items: center;
justify-content: space-between;
gap: 14px;
margin-bottom: 16px;
padding: 14px 16px;
border: 1px solid var(--line);
border-radius: 17px;
background: rgba(7, 17, 31, .70);
box-shadow: 0 12px 35px rgba(0,0,0,.24);
backdrop-filter: blur(8px);
}
.page-step-info { min-width: 0; }
.page-step-kicker {
display: block;
color: var(--accent);
font-size: 11px;
font-weight: 900;
letter-spacing: .11em;
text-transform: uppercase;
margin-bottom: 3px;
}
.page-step-title {
display: block;
font-size: 16px;
font-weight: 900;
}
.page-step-note {
display: block;
margin-top: 3px;
color: var(--muted);
font-size: 12px;
line-height: 1.4;
}
.setup-next-bar {
display: flex;
justify-content: flex-end;
margin-top: 18px;
padding: 16px;
border: 1px solid var(--line);
border-radius: 18px;
background: rgba(7, 17, 31, .66);
box-shadow: var(--shadow);
backdrop-filter: blur(8px);
}
.setup-next-bar .primary-btn {
min-width: min(300px, 100%);
font-size: 15px;
padding: 14px 20px;
}
.draw-back-bar {
display: flex;
justify-content: flex-start;
margin-top: 18px;
padding: 16px;
border: 1px solid var(--line);
border-radius: 18px;
background: rgba(7, 17, 31, .66);
box-shadow: var(--shadow);
backdrop-filter: blur(8px);
}
.draw-back-bar .secondary-btn {
min-width: min(240px, 100%);
white-space: nowrap;
}
#drawPage .picker-card { margin-top: 0; }
@keyframes pageFade {
from { opacity: 0; transform: translateY(8px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes pulseRoll {
from { transform: scale(.98); opacity: .62; }
to { transform: scale(1.025); opacity: 1; }
}
@keyframes winnerPop {
0% { transform: scale(.72) rotate(-2deg); opacity: 0; }
65% { transform: scale(1.08) rotate(1deg); opacity: 1; }
100% { transform: scale(1) rotate(0); opacity: 1; }
}
@keyframes rowIn {
from { opacity: 0; transform: translateY(-7px); }
to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 1020px) {
.top-grid, .picker-layout { grid-template-columns: 1fr; }
.draw-panel { min-height: 330px; }
}
@media (max-width: 700px) {
body { padding: 12px; }
.hero { flex-direction: column; }
.hero-left { align-items: flex-start; }
.hero-right { width: 100%; justify-content: flex-start; }
.sponsor-box { width: 100%; min-width: 0; min-height: 125px; }
.sponsor-logo { width: 100%; max-width: 100%; max-height: 110px; }
.list-grid, .text-settings-grid { grid-template-columns: 1fr; }
.card-head { align-items: flex-start; }
.picker-layout { padding: 12px; }
.footer-actions { padding: 0 12px 12px; }
.picked-name { font-size: 38px; }
.page-step-bar, .draw-page-toolbar { align-items: stretch; flex-direction: column; }
.draw-back-bar .secondary-btn, .setup-next-bar .primary-btn { width: 100%; }
.setup-next-bar { padding: 12px; }
}

let number = index + 1;

result = String.fromCharCode(65 + (number % 26)) + result;
number = Math.floor(number / 26);
}
return result;
};

});

const normalizeLines = (text) => {

const sanitizeListTypes = (items) => {
const used = new Set();
const output = [];
(Array.isArray(items) ? items : []).forEach((item, index) => {
let id = String(item?.id || makeId('list'));
while (used.has(id)) id = makeId('list');
used.add(id);
output.push({
id,
label: String(item?.label || Senarai ${index + 1}).trim() || Senarai ${index + 1}
});
});
return output.length ? output : [{ id: makeId('list'), label: 'Senarai 1' }];
};
const sanitizeTeam = (team, index, listTypes) => {
const members = {};
listTypes.forEach(item => {
const directLegacy = Array.isArray(team?.[item.id]) ? team[item.id] : null;
const stored = Array.isArray(team?.members?.[item.id]) ? team.members[item.id] : directLegacy;
members[item.id] = Array.isArray(stored) ? stored.map(String) : [];
});
return {
id: String(team?.id || makeId('team')),
name: String(team?.name || Team ${teamLetter(index)}),
members
};
};
const sanitizeHistory = (history, listTypes) => {
const validIds = new Set(listTypes.map(item => item.id));
return (Array.isArray(history) ? history : []).map(item => {
const listId = String(item?.listId || item?.role || '');
if (!validIds.has(listId)) return null;
if (Array.isArray(item?.names)) {
return {
batchId: String(item.batchId || makeId('batch')),
listId,
names: item.names.map(String).filter(Boolean),
teamId: String(item.teamId || ''),
assignmentMode: item.assignmentMode === 'manual' ? 'manual' : 'auto',
previousNextTeamIndex: Number.isInteger(item.previousNextTeamIndex) ? item.previousNextTeamIndex : 0
};
}
if (item?.name) {
return {
batchId: String(item.batchId || makeId('legacy-batch')),
listId,
names: [String(item.name)],
teamId: String(item.teamId || ''),
assignmentMode: item.assignmentMode === 'manual' ? 'manual' : 'auto',
previousNextTeamIndex: Number.isInteger(item.previousNextTeamIndex) ? item.previousNextTeamIndex : 0
};
}
return null;
}).filter(item => item && item.names.length && item.teamId);
};
const sanitizeCategory = (category, index, listTypes) => {
const teams = (Array.isArray(category?.teams) ? category.teams : [])
.map((team, teamIndex) => sanitizeTeam(team, teamIndex, listTypes));
while (teams.length < 2) teams.push(defaultTeam(teams.length, listTypes));
const inputs = {};
const nextTeamIndex = {};
listTypes.forEach(item => {

nextTeamIndex[item.id] = Math.max(0, Number(category?.nextTeamIndex?.[item.id]) || 0) % teams.length;
});

? String(category.manualTeamId)
: teams[0].id;
return {
id: String(category?.id || makeId('category')),
name: String(category?.name || Kategori ${index + 1}),
inputs,
teams,
nextTeamIndex,
manualTeamId,
history: sanitizeHistory(category?.history, listTypes)
};
};
// Memulihkan objek state dari Firebase (kerana Firebase membuang array kosong [])
const hydrateRemoteState = (remoteState) => {
const listTypes = sanitizeListTypes(remoteState.listTypes);

? remoteState.categories.map((cat, idx) => sanitizeCategory(cat, idx, listTypes))
: [defaultCategory(0, listTypes)];
return {
appTitle: String(remoteState.appTitle || DEFAULT_TITLE),
activeCategory: Math.min(Math.max(0, Number(remoteState.activeCategory) || 0), categories.length - 1),
activeListId: listTypes.some(item => item.id === remoteState.activeListId)
? remoteState.activeListId
: listTypes[0].id,
assignmentMode: remoteState.assignmentMode === 'manual' ? 'manual' : 'auto',
drawCount: ALLOWED_DRAW_COUNTS.includes(Number(remoteState.drawCount)) ? Number(remoteState.drawCount) : 1,
drawing: false,
listTypes,
categories
};
};

const receiveDrawEvent = (event) => {

}
};

} else if (event.status === 'done') {

void el.pickedName.offsetWidth;
